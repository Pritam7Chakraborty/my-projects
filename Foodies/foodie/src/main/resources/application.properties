spring.application.name=foodie

# ----------------------------------------
# ?? DATABASE CONFIGURATION (Smart Switch)
# ----------------------------------------
# Logic: Use the Environment Variable (Cloud/Docker) if present.
# Otherwise, use the "Default Value" (after the colon :) for local dev.

# 1. URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodie_db?createDatabaseIfNotExist=true}

# 2. Username
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springstudent}

# 3. Password
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:springstudent}

# 4. Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# ?? HIBERNATE SETTINGS
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect