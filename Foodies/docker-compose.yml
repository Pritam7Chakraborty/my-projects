version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: foodie_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodie_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./foodie  
    container_name: foodie_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/foodie_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - mysqldb

  frontend:
    build: ./Foodies_frontend 
    container_name: foodie_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data: